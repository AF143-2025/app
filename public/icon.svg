  <circle cx="256" cy="240" r="45" fill="url(#phoneGrad)" opacity="0.2" />
  <path d="M256 200 L266 230 L296 240 L266 250 L256 280 L246 250 L216 240 L246 230 Z" fill="#34d399" />
